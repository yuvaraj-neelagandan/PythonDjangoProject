
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Manager</title>
</head>
<body>
    <h1>Employee Salary Filter</h1>
    <input type="number" id="salaryInput" placeholder="Min salary" />
    <button onclick="fetchSalaries()">Fetch</button>
    <ul id="results"></ul>

    <script>
        async function fetchSalaries() {
            const minSalary = document.getElementById('salaryInput').value;
            let url = 'https://<your-heroku-app>.herokuapp.com/api/salaries/';
            if (minSalary) url += `?min_salary=${minSalary}`;
            const res = await fetch(url);
            const data = await res.json();
            const list = document.getElementById('results');
            list.innerHTML = '';
            data.forEach(e => {
                const li = document.createElement('li');
                li.textContent = `${e.name} - ₹${e.salary}`;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
